# Tooling for this repo. Node comes from mise so tasks do not depend on
# whatever happens to be on PATH. The SPA lives in starter/. The Node server
# in server/ serves that build and the /api routes.

[tools]
node = "lts"

[tasks."test:setup"]
description = "Install starter/ dependencies"
alias = "install"
dir = "starter"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."test:server"]
description = "Run the Node server tests"
run = "node --test server/app.test.js"

[tasks.test]
description = "Run the Vitest suite and the Node server tests"
dir = "starter"
depends = ["test:setup", "test:server"]
run = "npm test"

[tasks."test:teardown"]
description = "Remove starter/ dependencies and test artifacts"
dir = "starter"
run = "rm -rf node_modules dist coverage .vite"

[tasks.dev]
description = "Run the Vite dev server"
dir = "starter"
depends = ["test:setup"]
run = "npm run dev"

[tasks.build]
description = "Typecheck and build the SPA into starter/dist"
dir = "starter"
depends = ["test:setup"]
run = "npm run build"

[tasks.serve]
description = "Serve the built SPA with the Node backend on port 8080"
depends = ["build"]
run = "node server/index.js"
env = { HOST = "0.0.0.0", PORT = "8080" }
